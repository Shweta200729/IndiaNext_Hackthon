services:
  # Backend - FastAPI
  - type: web
    name: indianext-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn server.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: SUPABASE
        fromConfig: true
      - key: SUPABASE_ROLE_KEY
        fromConfig: true
      - key: GROQ_API_KEY
        fromConfig: true

  # Frontend - Next.js
  - type: web
    name: indianext-frontend
    env: node
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && npm run start"
    envVars:
      - key: NEXT_PUBLIC_BACKEND_URL
        fromContext: backend_url
      - key: NEXT_PUBLIC_SUPABASE_URL
        fromConfig: true
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        fromConfig: true
